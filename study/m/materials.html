<!doctype html>
<html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The materials lab</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"><link rel="stylesheet" href="../kit.css">
<style>
#k-main text,#k-close text{font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
#k-main text.mf,#k-close text.mf{font-family:"Fredoka","Instrument Sans",system-ui,sans-serif}
#k-main [data-act]{cursor:pointer}
/* keep long select options from widening the bench on phones */
.stage{grid-template-columns:minmax(0,1fr)}
.ctl{min-width:0;max-width:100%}
.ctl select{min-width:0;max-width:100%;flex:1 1 auto;text-overflow:ellipsis}
#k-main [data-act]:hover .hov{stroke:var(--acc);stroke-width:2.5}
</style></head>
<body><div id="app"></div><script src="../kit.js"></script><script src="materials.js"></script><script src="/ask.js" defer data-page="study"></script><script src="/lab/navigation.js" defer></script></body></html>
