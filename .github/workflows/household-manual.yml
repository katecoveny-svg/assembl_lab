name: Household manual release
on:
  push:
    paths:
      - 'household/**'
      - 'tests/household/**'
      - '.github/workflows/household-manual.yml'
  pull_request:
    paths:
      - 'household/**'
      - 'tests/household/**'
      - '.github/workflows/household-manual.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/household/*.test.mjs tests/household/test.mjs
      - run: |
          node --check household/app.mjs
          node --check household/trip.mjs
          git diff --check
