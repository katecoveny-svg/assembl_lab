name: NZ Data MCP review
on:
  pull_request:
    paths:
      - 'tools/nz-data-mcp/**'
      - 'evidence/**'
      - '.github/workflows/nz-data-mcp.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --version
      - run: node --test tools/nz-data-mcp/service.test.mjs evidence/tests/*.test.mjs
      - run: git diff --check
