<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Services from a plan: plan to 4D · assembl lab</title>
<meta name="description" content="Heating and ventilation, drainage, water supply and electrical, generated from a plan model: placed on the plan, laid in 3D, clash-checked, rerouted and pre-checked against the NZ Building Code. Shown on the 16A homes, or on a plan you drop in. An advisory simulation on a design study.">
<meta property="og:title" content="Services from a plan: plan to 4D · assembl lab">
<meta property="og:description" content="Every pipe, duct and cable for a home, placed from its plan, assembled in 3D, clash-checked and pre-checked. Advisory, on a design study.">
<meta name="theme-color" content="#FFFDFB">
<link rel="icon" href="/site-v2/mark-a-32.png" sizes="32x32" type="image/png">
<link rel="canonical" href="https://lab.assembl.co.nz/plan-studio/twins/services/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./services.css?v=4">
<script type="importmap">{ "imports": { "three": "/assets/vendor/three/three.module.min.js", "three/addons/": "/assets/vendor/three/addons/" } }</script>
</head>
<body>
<a class="skip" href="#panel">Skip to the checks</a>
<main class="wrap">
  <canvas id="stage" aria-label="3D view of a home with its services: ducts, pipes, cables and fixtures. Hover or tap a part to name it."></canvas>

  <section class="card count" aria-live="polite">
    <p class="kick mono" id="kick">Plan to 4D · services</p>
    <p class="big"><span id="count">0</span> <span class="of mono" id="count-of">/ 0</span></p>
    <p class="cap mono" id="count-cap">plan symbols placed</p>
    <div class="homes" id="homes" role="group" aria-label="Which home" hidden></div>
  </section>

  <section class="card legend-card" aria-label="Systems">
    <div id="legend"></div>
    
  </section>

  <p id="clash" class="clash mono" role="status"></p>
  <p id="tip" class="tip mono" hidden></p>

  <aside class="card panel" id="panel" aria-labelledby="panel-h">
    <p class="kick mono" id="panel-h">Pre-check · tap for the working</p>
    <ul id="checks" class="checks"></ul>
    <ul id="stats" class="stats"></ul>
    <ul id="notes" class="notes"></ul>
    <p class="mono small"><span id="parts-total">0</span> parts in all</p>
  </aside>

  <nav class="bar" aria-label="Playback">
    <button id="play" type="button">Pause</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Scrub through the build">
    <button id="apart" type="button" aria-pressed="false" disabled>Pull the systems apart</button>
    <button id="skip" type="button">Skip to the model</button>
    <a class="back" href="/plan-studio/twins/drop/">Use your own plan&nbsp;↗</a>
  </nav>

  <p class="fine"><span id="source"></span><span class="sq" aria-hidden="true"></span>Sample · proposed by the tool from the plan · advisory, not a compliance check</p>
  <div class="dropzone" id="dropzone" aria-hidden="true"><p>Drop a plan model (.json) to see its services</p></div>
</main>
<script type="module" src="./scene.js?v=4"></script>
<script src="/lab/navigation.js" defer></script>
</body>
</html>
