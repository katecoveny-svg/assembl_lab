 root.traverseVisible(o=>{if(!o.isMesh||o.isLine2||o.isLineSegments2||(o.material?.isShaderMaterial&&!(['sky','space'].includes(id)&&o.material.uniforms?.map))||o.material?.opacity===0)return;const add=(matrix,name,color)=>{let material=o.material;if(['sky','space'].includes(id)&&material.isShaderMaterial)material=new T.MeshStandardMaterial({map:material.uniforms.map.value,roughness:1,transparent:material.transparent,opacity:material.opacity});if(color&&!Array.isArray(material)){material=material.clone();material.color.multiply(color)}const mesh=new T.Mesh(geometry(o.geometry),material);mesh.name=id==='space'&&o.material?.isShaderMaterial?'Saturn_rings':name;mesh.applyMatrix4(matrix);clean.add(mesh);if(id==='space'&&o.material?.isShaderMaterial&&o.material.uniforms?.map){const back=mesh.clone();back.geometry=mesh.geometry.clone();const ix=back.geometry.index;if(ix){for(let i=0;i<ix.count;i+=3){const b=ix.getX(i+1);ix.setX(i+1,ix.getX(i+2));ix.setX(i+2,b)}}back.geometry.computeVertexNormals();back.name='Saturn_ring_back';clean.add(back)}};if(o.isInstancedMesh){for(let i=0;i<o.count;i++){const m=new T.Matrix4();o.getMatrixAt(i,m);if(Math.abs(m.determinant())<1e-8)continue;const color=o.instanceColor?new T.Color():null;if(color)o.getColorAt(i,color);add(new T.Matrix4().multiplyMatrices(o.matrixWorld,m),o.name+'_'+i,color)}}else add(o.matrixWorld,o.name)});

 if(id==='vinyl'){const rig=createVinylRig(root);rig.setVisualState();rig.setView({assembly:'deck',serviceCutaway:false});}
 if(id==='house'){root.scale.setScalar(.02);}
 if(id==='phone'){const rig=createPhoneRig(root);rig.setVisualState({explode:0,indicatorFraction:.5});rig.setView({station:'CHARGE_STATION',hidePhoneBack:false});}
 if(id==='slushie-main'){const rig=createSlushieRig(root);rig.setVisualState({augerAngle:.4,fanAngle:0,ventBlocked:false,shellVisible:false});rig.setView({cutaway:true,mechanism:true,showCup:false});}
