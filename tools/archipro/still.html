<!doctype html>
<meta charset="utf-8">
<title>16A still (build tool)</title>
<!-- Build tool, not a page. Renders a still of the 16A homes GLB (exported from the live twin) for the concept page's
     poster frame, before the live twin is opened. ?az=degrees&el=degrees&d=distance factor&sun=degrees -->
<style>html,body{margin:0;background:#21121F}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/assets/vendor/three/three.module.min.js", "three/addons/": "/assets/vendor/three/addons/" } }</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search), W = +(q.get("w") || 1600), H = +(q.get("h") || 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = +(q.get("exp") || 0.95);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
// a late-afternoon sky as a vertical gradient
const sky = document.createElement("canvas"); sky.width = 4; sky.height = 256; const g = sky.getContext("2d");
const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, "#9FB3C8"); gr.addColorStop(0.55, "#E8D9CC"); gr.addColorStop(1, "#F4E3D3"); g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
const skyT = new THREE.CanvasTexture(sky); skyT.colorSpace = THREE.SRGBColorSpace; scene.background = skyT;
const gltf = await new GLTFLoader().loadAsync(q.get("glb"));
const root = gltf.scene; scene.add(root);
root.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
// ground: a quiet lawn tone, and a little falloff by fog
const ground = new THREE.Mesh(new THREE.CircleGeometry(900, 96), new THREE.MeshStandardMaterial({ color: q.get("ground") || "#7E8C5E", roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(c.x, box.min.y - 0.6, c.z); ground.receiveShadow = true; scene.add(ground);
scene.fog = new THREE.Fog("#EFDFD0", +(q.get("fn") || 45), +(q.get("ff") || 150));
const sunAz = THREE.MathUtils.degToRad(+(q.get("sun") || 300)), sunEl = THREE.MathUtils.degToRad(+(q.get("sunel") || 24));
const sun = new THREE.DirectionalLight("#FFE2C2", 3.4); sun.position.set(c.x + Math.cos(sunAz) * 80 * Math.cos(sunEl), c.y + 80 * Math.sin(sunEl), c.z + Math.sin(sunAz) * 80 * Math.cos(sunEl)); sun.target.position.copy(c);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); const R = Math.max(size.x, size.z) * 0.8; Object.assign(sun.shadow.camera, { left: -R, right: R, top: R, bottom: -R, near: 1, far: 240 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target, new THREE.HemisphereLight("#CFE0F0", "#5A5040", 0.35));
const az = THREE.MathUtils.degToRad(+(q.get("az") || 210)), el = THREE.MathUtils.degToRad(+(q.get("el") || 22)), d = Math.max(size.x, size.z) * +(q.get("d") || 1.15);
const cam = new THREE.PerspectiveCamera(+(q.get("fov") || 32), W / H, 0.5, 900);
const tgt = c.clone().add(new THREE.Vector3(+(q.get("tx") || 0), -size.y * 0.15, +(q.get("tz") || 0)));
cam.position.set(tgt.x + Math.cos(az) * Math.cos(el) * d, tgt.y + Math.sin(el) * d, tgt.z + Math.sin(az) * Math.cos(el) * d); cam.lookAt(tgt);
renderer.render(scene, cam);
window.__cam = [cam.position.x, cam.position.y, cam.position.z, tgt.x, tgt.y, tgt.z].map((v) => +v.toFixed(2));
window.__png = renderer.domElement.toDataURL("image/png"); document.title = "done";
</script>
