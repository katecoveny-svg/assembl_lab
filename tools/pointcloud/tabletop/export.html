<!doctype html><html><head><meta charset="utf-8"><title>Auckland tabletop export</title><script type="importmap">{"imports":{"three":"/assets/vendor/three/three.module.min.js","three/addons/":"/assets/vendor/three/addons/"}}</script></head><body><p>Offline terrain export tool</p><script type="module">
import * as T from 'three';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';

const data=await(await fetch('./mesh.json')).json(),root=new T.Group();root.name='Auckland_tabletop_70cm_5x_relief';root.userData=data.manifest;
const mat=(color)=>new T.MeshStandardMaterial({color,roughness:.88,metalness:0});

const base=new T.Mesh(new T.BoxGeometry(.74,.016,depth+.10),mat('#332332'));base.position.set(0,.008,.025);base.name='Presentation_plinth_not_geographic';root.add(base);
const sea=new T.Mesh(new T.PlaneGeometry(.7,depth).rotateX(-Math.PI/2),mat('#b39bab'));sea.position.y=.0162;sea.name='Mapped_water_background_not_bathymetry';root.add(sea);

const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(data.pos,3));g.setAttribute('uv',new T.Float32BufferAttribute(data.uv,2));g.setIndex(data.indices);g.computeVertexNormals();

const plaqueTex=new T.CanvasTexture(c);plaqueTex.colorSpace=T.SRGBColorSpace;const plaque=new T.Mesh(new T.PlaneGeometry(.70,.075).rotateX(-Math.PI/2),new T.MeshStandardMaterial({map:plaqueTex,roughness:1}));plaque.position.set(0,.0163,depth/2+.045);plaque.name='Scale_and_source_plaque';root.add(plaque);root.updateMatrixWorld(true);
const b64=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)};

</script></body></html>
