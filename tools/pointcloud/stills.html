<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><title>Point-cloud stills · assembl lab</title>
<style>html,body{margin:0;background:#21121F}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/assets/vendor/three/three.module.min.js","three/addons/":"/assets/vendor/three/addons/"}}</script></head>
<body><canvas id="c"></canvas><script type="module">
// Renders one still at a time with the shared engine (lab/pc/engine.js): an image, the Plan Studio hall, or a procedural shape.
// Driven by tools/pointcloud/stills.cjs; open by hand to try a job in the console: await renderStill({ kind: "image", src: "/assets/posters/ed.webp", w: 1206, h: 872 })
import * as THREE from "three";
import { createEngine, imageForm, objectForm, normalise } from "/lab/pc/engine.js";
import { hallForm } from "/lab/pc/forms.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
const loadImg = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("image " + src)); i.src = src; });
window.renderStill = async (job) => {
  const c = document.getElementById("c"); c.style.width = job.w + "px"; c.style.height = job.h + "px"; c.width = job.w; c.height = job.h;
  const N = job.n || (job.kind === "image" ? 300000 : 160000), e = createEngine(c, { budget: N, reduceMotion: true, pixelRatio: 1, sizeScale: job.kind === "image" ? Math.max(1, 900 / job.h) * 0.9 : 1 });
  let f, scale = 1, offset = [0, 0, 0], rot = job.rot ?? 0;
  if (job.kind === "image") {
    f = normalise(imageForm(await loadImg(job.src), N, { maxSide: 520, crop: job.crop }), 1, { ground: false });
    e.camera.position.set(0, 0, 3.4); e.camera.lookAt(0, 0, 0); e.camera.aspect = job.w / job.h; e.camera.updateProjectionMatrix();
    const vis = 2 * 3.4 * Math.tan((15 * Math.PI) / 180) * (job.w / job.h); scale = vis * (job.fill ?? 1.04);
    e.setLift(0.5, 0.5);
  } else if (job.kind === "hall") { f = await hallForm(N); offset = [0, 0.02, 0]; scale = job.scale ?? 1.35; rot = job.rot ?? 0.5; e.camera.position.set(0, 0.7, 3.2); e.camera.lookAt(0, 0.22, 0); e.setLift(0.5, 0.55); }
  else if (job.kind === "glb") {
    const gl = new GLTFLoader(); gl.setMeshoptDecoder(MeshoptDecoder); const g = await gl.loadAsync(job.src);
    g.scene.traverse((o) => { if (o.isMesh && /glass|window/i.test(o.material?.name || "")) o.userData.glass = true; });
    f = normalise(objectForm(g.scene, N, { edgeShare: 0.36, groundShare: 0.06, weight: (m) => (m.userData.glass ? 0.25 : 1) }), 1.5);
    scale = job.scale ?? 1.3; rot = job.rot ?? 0.55; e.camera.position.set(0, job.camY ?? 0.75, 3.2); e.camera.lookAt(0, job.lookY ?? 0.2, 0); e.setLift(0.5, 0.55);
  }
  else if (job.kind === "knot") { const m = new THREE.Mesh(new THREE.TorusKnotGeometry(0.42, 0.13, 260, 28, 2, 3)); m.position.y = 0.6; f = normalise(objectForm(m, N, { edgeShare: 0.2, groundShare: 0.06 }), 1.1); scale = job.scale ?? 1.25; e.camera.position.set(0, 0.6, 3.3); e.camera.lookAt(0, 0.42, 0); e.setLift(0.5, 0.5); }
  e.group.rotation.y = rot; e.setForm(f, { immediate: true, offset, scale }); e.render();
  const url = c.toDataURL("image/png"); e.dispose(); return url;
};
window.ready = true;
</script></body></html>
