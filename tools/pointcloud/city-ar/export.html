<!doctype html><html><head><meta charset="utf-8"><title>City AR export — local</title><script type="importmap">{"imports":{"three":"/assets/vendor/three/three.module.min.js","three/addons/":"/assets/vendor/three/addons/"}}</script></head><body><p>Shared browser city geometry → uniformly scaled CBD crop.</p><script type="module">
import * as T from 'three';
import {createCityModel} from '/auckland/3d/city-model.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';

const {root,data,groups,landmark,landmarkMesh}=await createCityModel(),h=await(await fetch('/assets/models/auckland/linz-terrain.json')).json();
const points=data.buildings.flatMap(b=>b.points),xmin=Math.min(...points.map(p=>p[0]))-.001,xmax=Math.max(...points.map(p=>p[0]))+.001,zmin=Math.min(...points.map(p=>p[1]))-.001,zmax=Math.max(...points.map(p=>p[1]))+.001;
// Clip only the surrounding terrain triangles, interpolating position and UV on the same plane.
function clipped(g){const src=g.index?g.toNonIndexed():g,p=src.attributes.position,uv=src.attributes.uv,out=[],tex=[];for(let i=0;i<p.count;i+=3){let poly=[0,1,2].map(k=>[p.getX(i+k),p.getY(i+k),p.getZ(i+k),uv.getX(i+k),uv.getY(i+k)]);for(const[axis,edge,sign]of [[0,xmin,1],[0,xmax,-1],[2,zmin,1],[2,zmax,-1]]){const next=[];for(let j=0;j<poly.length;j++){const a=poly[j],b=poly[(j+1)%poly.length],ia=(a[axis]-edge)*sign>=0,ib=(b[axis]-edge)*sign>=0;if(ia)next.push(a);if(ia!==ib){const t=(edge-a[axis])/(b[axis]-a[axis]);next.push(a.map((v,k)=>v+(b[k]-v)*t));}}poly=next;}for(let j=1;j+1<poly.length;j++)for(const v of [poly[0],poly[j],poly[j+1]]){out.push(...v.slice(0,3));tex.push(...v.slice(3));}}const result=new T.BufferGeometry();result.setAttribute('position',new T.Float32BufferAttribute(out,3));result.setAttribute('uv',new T.Float32BufferAttribute(tex,2));result.computeVertexNormals();return result;}
const core=new T.Group();core.name='Auckland_CBD_true_proportions';let terrain;
root.traverse(o=>{if(o.isMesh&&o.name.includes('LINZ_bare'))terrain=o;});
const land=new T.Mesh(clipped(terrain.geometry),terrain.material);land.name='LINZ_same_surface_CBD_crop_vertical_1x';core.add(land);
const sea=new T.Mesh(new T.PlaneGeometry(xmax-xmin,zmax-zmin).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:'#b39bab',roughness:1}));sea.position.set((xmin+xmax)/2,.01622,(zmin+zmax)/2);sea.name='Water_background_not_bathymetry';core.add(sea);
const parity={};for(const [kind,m]of Object.entries(groups)){const q=m.clone();q.geometry=m.geometry.clone();q.geometry.deleteAttribute('feature');q.name='OSM_'+kind+'_heights';core.add(q);const a=m.geometry.attributes.position.array,b=q.geometry.attributes.position.array;parity[kind]={vertices:a.length/3,identical:a.length===b.length&&a.every((v,i)=>v===b[i])};}
const sky=landmarkMesh.clone();sky.geometry=landmarkMesh.geometry.clone();core.add(sky);parity.skytower={vertices:sky.geometry.attributes.position.count,identical:sky.geometry.attributes.position.array.every((v,i)=>v===landmarkMesh.geometry.attributes.position.array[i])};

core.scale.setScalar(uniform);core.position.set(-midX*uniform,-base*uniform+.004,-midZ*uniform);core.updateMatrixWorld(true);

const hb=h.nztmBounds,cx=(hb.minX+hb.maxX)/2,cy=(hb.minY+hb.maxY)/2;const bounds=new T.Box3().setFromObject(model),manifest={units:'metres',upAxis:'Y',verticalExaggeration:1,uniformXYZScale: data.scale*uniform,scaleDenominator:1/(data.scale*uniform),cropWidthMetres:.7,cropDepthMetres:depth,modelDimensionsMetres:bounds.getSize(new T.Vector3()).toArray(),projectedCRS:'EPSG:2193',verticalDatum:'NZVD2016 EPSG:7839',projectedBounds:{west:cx+xmin/data.scale,east:cx+xmax/data.scale,south:cy-zmax/data.scale,north:cy-zmin/data.scale},sourceBuildingBboxWGS84:[174.755,-36.853,174.774,-36.839],heightCounts:data.counts,landmark:{name:landmark.name,parts:16,taggedHeightMetres:328,unverified:true,omittedParts:9,source:landmark.source},geometryParity:parity,source:data.source,sourceRetrieved:data.retrieved,limits:'Same CBD building meshes as browser, same terrain surface clipped to extent. Uniform XYZ scaling only; wider harbour excluded. Building bases use coarse terrain at centroid. Flat roofs, tagged heights unverified, levels-derived estimates, unknown flat footprints. Sky Tower is 16 simplified OSM-tagged parts, with 9 unsupported/height-unknown parts omitted; no interiors or architectural-detail claim. Native AR has no browser selectors. Device placement untested.'};
model.userData=manifest;
const b64=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)};
window.exportCity=async()=>({glb:b64(await new GLTFExporter().parseAsync(model,{binary:true,maxTextureSize:2048})),usdz:b64(await new USDZExporter().parseAsync(model,{quickLookCompatible:true,maxTextureSize:2048,includeAnchoringProperties:true,ar:{anchoring:{type:'plane'},planeAnchoring:{alignment:'horizontal'}}})),manifest});window.ready=true;
</script></body></html>
