<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2730">
<title>Auckland live · buses, trains and ferries in 3D · assembl lab</title>
<meta name="description" content="Find your bus, train or ferry in Tāmaki Makaurau Auckland and see where it is in 3D right now, from Auckland Transport's live data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./live.css">
<script type="importmap">{"imports":{"three":"/assets/vendor/three/three.module.min.js","three/addons/":"/assets/vendor/three/addons/"}}</script>
</head>
<body>
<canvas id="scene" aria-label="Auckland in 3D with live buses, trains and ferries. Drag to move, pinch or scroll to zoom, tap a vehicle to see it." tabindex="0"></canvas>
<div id="label" class="vlabel" hidden></div>

<header class="top">
  <a class="brand" href="/">assembl <span>lab</span></a>
  <h1>Auckland live</h1>
  <a class="switch-view" id="switch-view" href="?view=3d">Open 3D city</a>
  <div class="search" role="search">
    <label for="q" class="vh">Search a route, stop or ferry terminal</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Route, stop or ferry terminal" aria-controls="results" aria-expanded="false">
    <ul id="results" role="listbox" hidden></ul>
  </div>
  <div class="modes" role="group" aria-label="Show">
    <button data-mode="all" aria-pressed="true">All</button>
    <button data-mode="bus" aria-pressed="false">Buses <b data-count="bus">–</b></button>
    <button data-mode="train" aria-pressed="false">Trains <b data-count="train">–</b></button>
    <button data-mode="ferry" aria-pressed="false">Ferries <b data-count="ferry">–</b></button>
  </div>
</header>

<aside id="panel" class="panel" aria-live="polite">
  <button class="grip" id="grip" aria-label="Show more or less"><span></span></button>
  <div id="detail"><p class="muted">Loading the city and the live positions…</p></div>
  <div class="legend" id="legend">
    <span><i style="--c:#2fbf71"></i>On time</span><span><i style="--c:#f2a33a"></i>Late</span><span><i style="--c:#e5533d"></i>10+ min late</span><span><i style="--c:#3aa0e8"></i>Early</span><span><i style="--c:#c3c7cc"></i>Not known</span>
    <small>On time here means up to 1 min early or 5 min late. Our band, not AT's measure.</small>
  </div>
</aside>

<div class="views" role="group" aria-label="Camera">
  <button data-view="harbour">Harbour</button><button data-view="city">City</button><button data-view="overview">Whole area</button>
</div>
<div id="weather" class="chip weather" hidden></div>

<footer id="truth" class="truth" role="contentinfo"><span id="truth-live">Positions: loading…</span></footer>

<noscript><p class="noscript">This page needs JavaScript and WebGL to show the city.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
