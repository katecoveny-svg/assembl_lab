<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2730">
<title>Auckland Live · find your bus, train or ferry · assembl Lab</title>
<meta name="description" content="Find your bus, train or ferry in Tāmaki Makaurau Auckland and see where it is in 3D right now, from Auckland Transport's live data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./live.css">
<script type="importmap">{"imports":{"three":"/assets/vendor/three/three.module.min.js","three/addons/":"/assets/vendor/three/addons/"}}</script>
</head>
<body>
<canvas id="scene" aria-label="Auckland in 3D with live buses, trains and ferries. Drag to move, pinch or scroll to zoom, tap a vehicle to see it." tabindex="0"></canvas>
<div id="label" class="vlabel" hidden></div>

<header class="top">
  <a class="brand" href="/">assembl <span>lab</span></a>
  <h1 class="vh">Auckland Live</h1>
  <a class="switch-view" id="switch-view" href="?view=3d">Open 3D city</a>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.75"/><path d="m15 15 5 5"/></svg>
    <label for="q" class="vh">Search a route, stop or ferry terminal</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Route, stop or vehicle ID" role="combobox" aria-autocomplete="list" aria-controls="results" aria-expanded="false">
    <ul id="results" role="listbox" hidden></ul>
    <div id="search-empty" role="status" hidden></div>
  </div>
  <div class="modes" role="group" aria-label="Show">
    <button data-mode="all" aria-pressed="true">All</button>
    <button data-mode="bus" aria-pressed="false">Buses <b data-count="bus">–</b></button>
    <button data-mode="train" aria-pressed="false">Trains <b data-count="train">–</b></button>
    <button data-mode="ferry" aria-pressed="false">Ferries <b data-count="ferry">–</b></button>
  </div>
  <div class="quick" role="group" aria-label="Passenger shortcuts">
    <button type="button" id="near-me"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/><circle cx="12" cy="12" r="1"/></svg>Nearby stops</button>
    <button type="button" id="saved-stops"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg>Saved stops</button>
    <a href="https://at.govt.nz/bus-train-ferry/timetables/school-bus-timetables" target="_blank" rel="noopener noreferrer">School buses ↗</a>
  </div>
</header>

<aside id="panel" class="panel" aria-label="Transit results">
  <button class="grip" id="grip" aria-expanded="true" aria-controls="detail">Minimise</button>
  <div id="detail" aria-live="polite"><p class="muted">Loading the city and the live positions…</p></div>
</aside>

<details class="status-key"><summary>Status key</summary>
  <div class="legend" id="legend">
    <span><i style="--c:#2fbf71"></i>On time</span><span><i style="--c:#f2a33a"></i>Late</span><span><i style="--c:#e5533d"></i>10+ min late</span><span><i style="--c:#3aa0e8"></i>Early</span><span><i style="--c:#c3c7cc"></i>Not known</span>
    <small>On time here means up to 1 min early or 5 min late. Our band, not AT's measure.</small>
  </div>
</details>

<div class="views" role="group" aria-label="Camera">
  <button id="fly-in" type="button" title="Cinematic camera move to the waterfront or selected stop">Fly in</button><button data-view="harbour">Harbour</button><button data-view="city">City</button><button data-view="ferry-building">Ferry Building</button><button data-view="overview">Whole area</button><button id="akl-sky" type="button" title="Cycle lighting: Live time, Golden Hour, or Clear Day">☀ Light: Live</button><button id="akl-still" type="button" title="Save clean PNG still of Auckland live">📷 Still</button>
</div>
<div id="weather" class="chip weather" hidden></div>

<footer id="truth" class="truth" role="contentinfo"><span id="truth-live">Positions: loading…</span><details class="data-sources"><summary>Data sources</summary><div id="source-detail"></div></details></footer>

<noscript><p class="noscript">This page needs JavaScript and WebGL to show the city.</p></noscript>
<script type="module" src="./app.js?v=20261129a"></script>
</body>
</html>
