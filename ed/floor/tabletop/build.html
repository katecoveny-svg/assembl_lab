<!doctype html><meta charset="utf-8"><title>Build ED tabletop locally</title><script type="importmap">{"imports":{"three":"/assets/vendor/three/three.module.min.js","three/addons/":"/assets/vendor/three/addons/"}}</script><button id="build">Build local artifacts</button><pre id="status">Local build only</pre><script type="module">
import {build} from './build.js';document.querySelector('#build').onclick=async()=>{try{document.querySelector('#status').textContent='Building…';const result=await build();for(const ext of ['glb','usdz','json']){const body=ext==='json'?JSON.stringify(result.manifest,null,2):result[ext];const r=await fetch('/save/'+ext,{method:'POST',body});if(!r.ok)throw Error('Local save failed');}document.querySelector('#status').textContent=JSON.stringify(result.manifest,null,2);}catch(e){document.querySelector('#status').textContent='Build failed: '+e.message;}};
</script>
